server:
  port: 8222

spring:
  application:
    name: gateway-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/student-wellness

  cloud:
    gateway:
      routes:
        - id: event-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/events/**
        - id: wellness-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/wellness/**
        - id: goal-tracking-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/goals/**

management:
  endpoints:
    web:
      exposure:
        include: "*"