version: '3.9'

services:
  # ---------------------------------------
  # KEYCLOAK DATABASE
  # ---------------------------------------
  keycloak-postgres:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data

  # ---------------------------------------
  # KEYCLOAK
  # ---------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /

      # ✔ FIXED HOSTNAME FOR DOCKER NETWORK
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      KC_HOSTNAME_DEBUG: "true"

    ports:
      - "8080:8080"
    volumes:
      - ./realm-export:/opt/keycloak/data/import
    depends_on:
      - keycloak-postgres



  # ---------------------------------------
  # SHARED POSTGRES FOR EVENTS + WELLNESS
  # ---------------------------------------
  postgres:
    image: postgres:15
    container_name: microservices-postgres
    environment:
      POSTGRES_DB: wellnessdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ms_pg_data:/var/lib/postgresql/data

  # ---------------------------------------
  # REDIS FOR WELLNESS SERVICE
  # ---------------------------------------
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  # ---------------------------------------
  # MONGODB FOR GOAL-TRACKING SERVICE
  # ---------------------------------------
  mongodb:
    image: mongo:6
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ---------------------------------------
  # WELLNESS RESOURCE SERVICE
  # ---------------------------------------
  wellness-service:
    build: ./wellness-resource-service
    container_name: wellness-service
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"

  # ---------------------------------------
  # GOAL TRACKING SERVICE
  # ---------------------------------------
  goal-tracking-service:
    build: ./goal-tracking-service
    container_name: goal-tracking-service
    depends_on:
      - mongodb
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"

  # ---------------------------------------
  # EVENT SERVICE
  # ---------------------------------------
  event-service:
    build: ./event-service
    container_name: event-service
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"

  # ---------------------------------------
  # API GATEWAY
  # ---------------------------------------
  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    depends_on:
      - keycloak
      - wellness-service
      - goal-tracking-service
      - event-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8222:8222"
    volumes:
      - ./gateway-service/src/main/resources:/app/resources


volumes:
  keycloak_pg_data:
  ms_pg_data:
  mongo_data:
